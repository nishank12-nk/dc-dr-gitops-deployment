apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-tag
spec:
  workspaces:
    - name: source
  results:
    - name: image-tag
      description: computed image tag (semver + short git sha)
  steps:
    - name: compute-tag
      image: alpine/git
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        SHORT_SHA=$(git rev-parse --short HEAD)
        DATE_TAG=$(date +%Y%m%d%H%M)
        TAG="1.0.${DATE_TAG}-${SHORT_SHA}"
        echo -n "$TAG" > $(results.image-tag.path)
        echo "Generated tag: $TAG"
